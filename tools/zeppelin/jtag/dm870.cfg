# DM870 (CR870 module) over a J-Link on the carrier's JTAG pads: ARM926EJ-S, one TAP, IR 4, IDCODE 0x15900f0f
adapter driver jlink
transport select jtag
adapter speed 1000
reset_config none
jtag newtap dm870 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x15900f0f
target create dm870.cpu arm926ejs -endian little -chain-position dm870.cpu
