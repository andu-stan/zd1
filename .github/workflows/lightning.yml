# The Lightning (ZD1L) stock-MCU work (docs/stock-mcu.md): builds the module images and runs the crates' tests on
# every push to its branch, reading the upstream Cachix cache (pawlowskialex-zd1) so unchanged parts are fetched, not
# rebuilt. Nothing is pushed to any cache and nothing is released; the images are kept as the run's artifacts.
name: lightning
on:
  push:
    branches: [lightning-stock-mcu]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "lightning-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  os-image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: pawlowskialex-zd1
          skipPush: true
      - name: build the module images
        run: |
          set -eu
          mkdir out
          os="$(nix build .#os-image -L --print-out-paths)"
          ls -la "$os"
          cp -L "$os"/os*.bcd "$os"/os*.fw "$os"/system*.cpio.gz "$os"/rescue*.cpio.gz "$os"/payload*.bin out/
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: out/
          retention-days: 30

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: pawlowskialex-zd1
          skipPush: true
      - name: the crates' tests (host-tests, zd1-linkd's among them on Linux)
        run: nix build .#checks.x86_64-linux.host-tests -L
      - name: formatting (informational)
        continue-on-error: true
        run: nix build .#checks.x86_64-linux.format -L

  # Both boards in Renode: os-zd1l.bcd installed in the test unit's NAND (booted through BL1), the main board running
  # B&W's Lightning MCU app (zd1lv20435.fw cut by bwfw.py; the ZD1's bootloader in front of it: the ZD1L's is in no
  # .fw) as board variant 2. What to look for: the rescue installing the system and switching to slot A, zd1-linkd in
  # stock-MCU mode, the MCU's setup task through the "9112" gate (HostVersion written), its DRC commands acked, and
  # no system error in mcu_log.txt. The logs are the run's artifact.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: pawlowskialex-zd1
          skipPush: true
      - name: Renode and the test unit
        run: python3 emu/zemu setup
      - name: B&W's Lightning firmware, cut into its module and MCU images
        run: |
          set -eu
          curl -sSL --fail -o "$RUNNER_TEMP/zd1l.fw" \
            https://archive.org/download/bw-zeppelin-air-software/zeppelin-air-lightning/zd1lv20435.fw
          echo "757a48bbf6fd7b531eedb56aee64f6799ce225874649ead179e7e00c2006d6c9  $RUNNER_TEMP/zd1l.fw" | sha256sum -c
          python3 -I tools/zeppelin/fw/bwfw.py "$RUNNER_TEMP/zd1l.fw" "$RUNNER_TEMP/zd1l"
          ls -la "$RUNNER_TEMP/zd1l"
      - name: "run A: B&W's firmware on both boards (the MCU builds its network-settings backup in its user page)"
        run: |
          set -u
          python3 emu/zemu run "$RUNNER_TEMP/zd1l/module.bcd" --nand --mcu "$RUNNER_TEMP/zd1l/mcu_flash.bin" \
            --renode 'zd1:board Adc "2:0x300"' --name stockA -q --timeout 600 --sleep 150 || echo "zemu exit $?"
          mkdir -p "$RUNNER_TEMP/up"
          cp emu/img/test-unit/user_page.bin "$RUNNER_TEMP/up/0-blank.bin"
          cp emu/run/stockA/user_page.bin "$RUNNER_TEMP/up/1-after-stock.bin"
          cp emu/run/stockA/user_page.bin "$RUNNER_TEMP/up/2-run-b.bin"     # run B's page, written in place
          cp emu/run/stockA/eeprom.bin "$RUNNER_TEMP/up/eeprom-b.bin"
          echo "== MCU log (run A)"; tail -40 emu/run/stockA/mcu_log.txt || true
      - name: "run B: our Lightning image (request log on) with B&W's Lightning MCU and run A's backup"
        run: |
          set -u
          os="$(nix build .#os-image --print-out-paths)"
          python3 emu/zemu run "$os/os-zd1l-trace.bcd" --nand --mcu "$RUNNER_TEMP/zd1l/mcu_flash.bin" \
            --renode 'zd1:board Adc "2:0x300"' \
            --renode "zd1:userpage Load @$RUNNER_TEMP/up/2-run-b.bin" \
            --renode "zd1:twi.eeprom File @$RUNNER_TEMP/up/eeprom-b.bin" \
            --name zd1l -q --timeout 1500 \
            --until 'stock MCU firmware' --sleep 150 \
            --sh 'zd1-ctl state playing airplay' --sleep 20 \
            --sh 'zd1-ctl volume 40' --sleep 20 \
            --sh 'zd1-ctl state stopped airplay' --sleep 20 \
            --sh 'cat /proc/mounts; zd1-ctl status' --sleep 5 \
            --sh 'printf "GET / HTTP/1.0\\r\\n\\r\\n" | nc 127.0.0.1 80 | head -40' || echo "zemu exit $?"
          cp emu/run/zd1l/user_page.bin "$RUNNER_TEMP/up/3-run-b-rundir.bin" || true
          echo "== module console: our lines"
          grep -a -h -E "rescue|stock|slot|linkd|DRC|panic|Oops|error" emu/run/zd1l/module_uart1.log | grep -a -v -E "MCU (read|write) " | tail -80 || true
          echo "== the status page (zd1-ctl serve on port 80)"
          grep -a -A40 "PRETTY_NAME=" emu/run/zd1l/module_uart1.log | head -45 || true
          echo "== the MCU's requests (zd1-linkd's log)"
          grep -a -h -o -E "MCU (read|write) [FV] 0x[0-9a-f]{2}" emu/run/zd1l/module_uart1.log | sort | uniq -c | sort -k4 | head -80 || true
          echo "== MCU log (run B)"; cat emu/run/zd1l/mcu_log.txt || true
      - name: the user page (the Wi-Fi backup) before and after
        run: |
          cd "$RUNNER_TEMP/up"
          sha256sum *.bin
          for f in 1-after-stock.bin 2-run-b.bin 3-run-b-rundir.bin; do
            printf '%s CooL at 0x1F7: ' "$f"; dd if="$f" bs=1 skip=503 count=4 2>/dev/null; echo
          done
          if cmp -s 1-after-stock.bin 2-run-b.bin; then echo "BACKUP UNCHANGED by run B"; else echo "BACKUP CHANGED by run B"; cmp -l 1-after-stock.bin 2-run-b.bin | head -40; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-zd1l
          path: |
            emu/run/zd1l/*.txt
            emu/run/zd1l/*.log
            emu/run/stockA/*.txt
            emu/run/stockA/*.log
            ${{ runner.temp }}/up/
          retention-days: 30
