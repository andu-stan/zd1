[package]
name = "dm870"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The DM870 (the network module's SoC) by name: every address, field and rule our code uses, in one place"

[features]
# /dev/mem as the bus (DevMem), for programs under Linux
linux = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
