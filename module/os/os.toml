# The module OS image: what goes into it. `nix build .#os-image` builds it (README.md).
# Paths are relative to the repo; outputs go to emu/img/os/ (gitignored).

[kernel]
# Nokia HD-1 Kernel_A (2.6.24.7, mach-sulu), unmodified: re/netmodule/NOKIA_HD1.md, provenance in blobs/README.md.
image = "blobs/module/nokia-hd1/kernel.bin"
# mem=31M: the top 1 MB of SDRAM stays out of Linux: the boot stub (0x61F00000, done once the kernel runs) and the
# Warp1 program window at 0x61FC0000 (wsl.ko maps it; docs/module/warp.md). Not 32512K: this kernel panics in
# kmem_cache_init with a memory size that is not a whole number of MB (1 MB section mappings).
# mtdparts (docs/module/storage.md): the vendor area read-only (BL1, PersParam, CnE, BL2, the app and resources
# partitions, with room for bad blocks: the vendor's addresses are logical), then ours: the two system slots (JFFS2,
# whole roots, read-only once installed; which one starts is the MCU's choice, the boot stub adds it as the root) and
# the data partition to the end of the chip (JFFS2: settings).
# panic=10: a slot whose root doesn't mount restarts the module, and the MCU counts that boot as failed.
cmdline = "console=ttyS1,115200 mem=31M mtdparts=sulu-nand:32m(vendor)ro,32m(system-a),32m(system-b),32m(data) panic=10"

[vendor]
# Binary pieces from Nokia's rootfs (blobs/module/nokia-hd1/rootfs) that only work with that kernel: its modules and the
# Wi-Fi firmware. `load` = insmod order at boot (/etc/modules).
root = "blobs/module/nokia-hd1/rootfs"
modules = [
  "drivers/base/firmware_class",
  "net/wireless/cfg80211",
  "net/mac80211/mac80211",
  "drivers/net/wireless/sulu/sulu_wlan",
  "arch/arm/mach-sulu/drivers/av-device",
  "arch/arm/mach-sulu/drivers/warp_debugger",
  "arch/arm/mach-sulu/drivers/securewarp",
  "arch/arm/mach-sulu/drivers/wsl",
  "sound/arm/snd-sulu",
]
load = [
  "drivers/base/firmware_class",
  "net/wireless/cfg80211",
  "net/mac80211/mac80211",
  "drivers/net/wireless/sulu/sulu_wlan",
  "arch/arm/mach-sulu/drivers/av-device",
  "sound/arm/snd-sulu",
]
firmware = ["lib/firmware/sulu-wlan.fw-rev78512", "lib/firmware/sulu-wlan.fw"]

[busybox]
# static, musl (nix/module/busybox.nix); busybox.config = our changes on top of `make defconfig`
version = "1.36.1"
url = "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
sha256 = "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314"
config = "module/os/busybox.config"
# The applets, everything else off (`make oldconfig` drops their options). The system's: what init's services run
# (udhcpc, ntpd, telnetd, mdev as the hotplug helper), then what a person uses on the console or the debug shell. No
# servers but telnetd (the debug shell), no init (ours: zd1-init) and no tools that change the vendor's partitions.
