[alsa]
# alsa-lib + alsa-utils (aplay, speaker-test, amixer), static against musl: the Nokia ALSA driver (snd-sulu on
# av-device) is the audio output. Hashes: first download, 2026-10-20.
version = "1.2.12"
lib = { url = "https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.12.tar.bz2", sha256 = "4868cd908627279da5a634f468701625be8cc251d84262c7e5b6a218391ad0d2" }
utils = { url = "https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.12.tar.bz2", sha256 = "98bc6677d0c0074006679051822324a0ab0879aea558a8f68b511780d30cd924" }
tools = ["aplay", "speaker-test", "amixer"]

[wpa]
# wpa_supplicant + wpa_cli for the Wi-Fi core (WPA2-PSK over Wireless Extensions), static against musl, stripped.
# config = its .config. Hash: w1.fi's release, 2026-10-24 (the same as the copy downloaded 2026-10-23).
version = "2.11"
url = "https://w1.fi/releases/wpa_supplicant-2.11.tar.gz"
sha256 = "912ea06f74e30a8e36fbb68064d6cdff218d8d591db0fc5d75dee6c81ac7fc0a"
config = "module/os/wpa_supplicant.config"

[apps]
# Rust crates in module/os/apps (one workspace, std, armv5te-unknown-linux-musleabi). Installed as one executable
# (apps/zd1, busybox style: one copy of std and the libraries) with a link per program: the core build in the rescue
# (/bin/zd1, `rescue` in /bin: only what the rescue runs, so it changes only when that does), the full build in the
# system (/usr/bin/zd1: `core` in /bin, `bins` in /usr/bin), and in the system's debug build `debug` too.
# `init` is PID 1 (/sbin/init; the rescue's /init).
workspace = "module/os/apps"
multicall = "zd1"
core = [
  "init",
  "zd1-linkd",
  "zd1-ctl",
  "zd1-board",
  "zd1-dhcp",
  "zd1-entropy",
  "zd1-persparam",
  "zd1-settings",
  "zd1-slot",
  "zd1-update",
]
rescue = ["init", "zd1-linkd", "zd1-ctl", "zd1-board", "zd1-persparam", "zd1-settings", "zd1-slot", "zd1-update"]
bins = ["zd1-snapcast", "zd1-airplay", "zd1-spotify"]
debug = ["zd1-selftest", "zd1-memsh"]

[boot]
# module/boot: the bare-metal boot stub in front of the kernel (MCU link, ATAGs). zd1-linkd, the
# link under Linux, is an app (above); both run the protocol in module/link.
crate = "module/boot"

[image]
overlay = "module/os/rootfs" # copied over everything else in the system (/etc: config)
# The debug variant: system-debug.cpio.gz, the system with the debug tools (zd1's `debug` feature: the self test,
# zd1-memsh, PersParam's raw reads, the link's request trace), and os-debug.bcd, whose command line has
# the debug services (init's `debug` service: a telnet shell, zd1-memsh) on by default (zd1.debug). The normal image
# has them off; either way the MCU switches them (`zd1 debug on|off|default`), nothing on the network can. The
# emulator's dev boot is the debug system, with zd1.debug.
[image.debug]
cmdline = "zd1.debug"
