[package]
name = "zd1-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The receivers' toolkit: the output (ALSA, snd-sulu), the link to the speaker (zd1-linkd), the command line and log"

[dependencies]
alsa = "0.9"
nix = { version = "0.29", default-features = false, features = ["time"] }
tracing = "0.1"
# tracing-log: librespot logs through `log`
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "tracing-log"] }
zd1-sys.workspace = true
