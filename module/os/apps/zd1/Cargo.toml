[package]
name = "zd1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The module OS's Rust programs in one executable (busybox style): one copy of std and the libraries"

[features]
default = ["full"]
# everything beyond what the rescue runs (docs/module/storage.md): the system's services and the receivers. The
# rescue's copy is the core alone: --no-default-features
full = ["zd1-init/full", "dep:zd1-net", "dep:zd1-entropy", "dep:zd1-snapcast", "dep:zd1-airplay", "dep:zd1-spotify"]
# the system's debug build (os.toml [image.debug]): the self test, the memory shell, PersParam's raw reads, the MCU
# link's request trace
debug = ["full", "dep:zd1-selftest", "dep:zd1-memsh", "zd1-linkd/debug", "zd1-persparam/debug"]

[dependencies]
zd1-compat.workspace = true
# the core
zd1-init = { workspace = true, default-features = false }
zd1-ctl.workspace = true
zd1-board.workspace = true
zd1-linkd.workspace = true
zd1-persparam.workspace = true
zd1-settings.workspace = true
zd1-slot.workspace = true
zd1-update.workspace = true
# the rest
zd1-net = { workspace = true, optional = true }
zd1-entropy = { workspace = true, optional = true }
zd1-selftest = { workspace = true, optional = true }
zd1-memsh = { workspace = true, optional = true }
zd1-snapcast = { workspace = true, optional = true }
zd1-airplay = { workspace = true, optional = true }
zd1-spotify = { workspace = true, optional = true }
